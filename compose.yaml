services:
  workbench:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      AW_DATABASE_PATH: /data/workbench.db
    volumes:
      - workbench-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  workbench-data:
